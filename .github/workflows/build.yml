name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode (the MLX packages need Xcode 26)
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Nook.xcodeproj -scheme Nook -configuration Debug \
            -destination 'platform=macOS' -skipMacroValidation CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild -project Nook.xcodeproj -scheme Nook -destination 'platform=macOS' \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO -only-testing:NookTests test 2>&1 | tee test.log
      - name: Errors and warnings
        if: always()
        run: grep -E "error:|warning:" build.log | sort -u || true
      - name: Test failures
        if: failure()
        run: grep -E "error:|failed|XCTAssert" test.log | sort -u | head -100 || true
