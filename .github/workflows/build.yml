name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Nook.xcodeproj -scheme Nook -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Errors and warnings
        if: always()
        run: grep -E "error:|warning:" build.log | sort -u || true
