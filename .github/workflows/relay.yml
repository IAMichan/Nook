name: Relay

on:
  push:
    branches: [main]
    paths: &paths
      - 'apps/relay/**'
      - '.github/workflows/relay.yml'
  pull_request:
    # `closed` is listed only so that merging or closing a PR cancels its queued run (see concurrency).
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a new push, or merging/closing the PR, cancels the run that is still queued or running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The relay for the iPhone companion (apps/relay): its room logic and message format, with Node's own test runner.
# Ubuntu only, seconds; it has no dependencies to install.
jobs:
  test:
    if: github.event.action != 'closed' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: npm test
