name: Relay

# Reusable: ci.yml calls it when the change touches its paths (scripts/ci-changes.sh). *Run workflow* runs only
# the relay's tests.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The relay for the iPhone companion (apps/relay): its room logic and message format, with Node's own test runner.
# Ubuntu only, seconds; it has no dependencies to install.
jobs:
  test:
    if: github.event.action != 'closed' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: npm test
