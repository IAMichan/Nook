name: Relay deploy

# Deploys Nook's own relay for the iPhone companion (apps/relay) to Cloudflare, so users turn on "Reach this Mac away
# from home" with one switch. Needs the repository secrets CLOUDFLARE_API_TOKEN (permission: Workers Scripts edit)
# and CLOUDFLARE_ACCOUNT_ID; without them the job says so and stops. Set the repository variable NOOK_RELAY_URL to the
# address it prints, and release.yml builds Nook with it (Info.plist NookRelayURL).

on:
  push:
    branches: [main]
    paths:
      - 'apps/relay/**'
      - '.github/workflows/relay-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; Nook's relay was not deployed."
            exit 0
          fi
          npx --yes wrangler@4 deploy | tee deploy.log
          address="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "Relay: ${address:-see the log}" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable NOOK_RELAY_URL to this address once." >> "$GITHUB_STEP_SUMMARY"
