name: Release
# Runs are named the way the releases are ("Nook 0.1.0 Beta 7"): after what they make, not after the tagged commit,
# which GitHub would show for a tag push. The version itself is computed later (scripts/next-release-tag.sh).
run-name: >-
  ${{ github.event_name == 'push' && format('Nook {0}', github.ref_name)
  || github.event_name == 'schedule' && 'Nook: daily beta check'
  || inputs.bump == 'stable' && format('Nook: stable release of {0}', github.ref_name)
  || inputs.bump == 'beta' && 'Nook: next beta'
  || format('Nook: first beta of the next {0} version', inputs.bump) }}

# Builds Nook.app in Release configuration and publishes it as a beta GitHub Release with a .dmg, a .zip and checksums.
# Then tauri.yml builds the Windows (.exe, .msi) and Linux (.deb, .AppImage) apps of the same commit, and the `desktop`
# job attaches them to that release with their own checksums. Those builds are not code-signed yet (Windows SmartScreen
# warns on first launch), and Android is left out until its APK is signed.
#
# New release: Actions › Release › Run workflow, pick what to bump (on the GitHub app too), and run it.
#   beta   next beta of the current version: v0.1.0-beta.1 → v0.1.0-beta.2 (the default)
#   patch / minor / major   first beta of the next version: v0.1.1-beta.1, v0.2.0-beta.1, v1.0.0-beta.1
#   stable the current version without the suffix (v0.1.0), built from its newest beta, so a regular release only
#          ships code that beta users already ran. Run it on that beta's tag (Run workflow › Use workflow from › Tags ›
#          v0.1.0-beta.4); the beta must be on main.
# The tag is computed by scripts/next-release-tag.sh. Pushing a regular release tag yourself (`git push origin v1.0.0`)
# works too; beta tags are left out of the push trigger, like t3code leaves out its nightly tags, because publishing
# creates them and would otherwise start a second run that has nothing to do. Release a beta with Run workflow.
# A tag with a suffix (-beta.N) becomes a pre-release; one without (v1.0.0) a regular release.
# The version without the suffix becomes the app's CFBundleShortVersionString.
#
# Fresh beta: with the repository variable NOOK_FRESH_BETA set to `true`, the schedule below releases the next beta
# of main once a day, but only when main has commits the newest release does not have and that release is at least
# 20 hours old. Without the variable the schedule does nothing (the `plan` job skips in seconds on ubuntu).
#
# The release stays a draft until the macOS, Windows and Linux files are all attached and checked; only then does the
# `publish` job make it public (and create the tag). A run that fails halfway leaves a draft nobody can download or
# update to: fix the cause and re-run the failed jobs, or delete the draft. Every download carries a build provenance
# attestation (`gh attestation verify <file> --repo IAMichan/Nook` shows it was built by this workflow from this repo);
# its Sigstore bundle is attached as Nook-<version>-<platform>.intoto.jsonl for offline checks (`--bundle <file>`).
#
# Signing, best first, by the repository secrets that are set:
#   MACOS_DEVELOPER_ID_P12 (+ _PASSWORD), with APPLE_NOTARY_APPLE_ID, APPLE_NOTARY_PASSWORD (an app-specific password)
#     and APPLE_TEAM_ID: signed with a Developer ID, notarized and stapled. macOS opens it without any warning, and
#     Keychain access and privacy permissions stay granted across updates. Needs a paid Apple Developer account.
#   MACOS_SIGNING_P12 (+ _PASSWORD): a stable self-signed identity (make one once with scripts/make-release-identity.sh).
#     macOS still blocks the first launch, but every update keeps the same signature, so you enter your password for the
#     Keychain and grant the permissions once instead of after every update.
#   neither: signed ad hoc. macOS blocks the first launch and treats every update as a new app.
# The release notes say how to open a build that is not notarized (Privacy & Security › Open Anyway, or `xattr`).
#
# Updates (docs/UPDATES.md, "Release builds"): with the repository secret NOOK_UPDATE_SIGNING_KEY and the repository
# variable NOOK_UPDATE_PUBLIC_KEY (make the pair once with `swift scripts/sign-update.swift generate`), the .zip gets an
# Ed25519 signature (.zip.sig) and the app carries the public key, so a downloaded Nook installs the next release from
# the update button after checking it. A release without them (or without a signing identity) fails instead of shipping.
# Release token: with the repository secret NOOK_RELEASE_TOKEN (a fine-grained token, or a GitHub App's, for this
# repository with Contents and Workflows read and write), the steps that create, fill and publish the release use it
# instead of the workflow's own token. GitHub refuses a release on a commit whose .github/workflows differ from main's
# to a token without the Workflows permission, and the workflow's own token can never have it. So without the secret, a
# workflow change merged into main during the hour-long build fails the release at the end with "HTTP 403: Resource
# not accessible by integration" (Beta 6); re-running does not help, start a new release from main instead.
# TDLib and nook-chatd are not bundled (they need scripts/build-tdlib.sh and scripts/build-chatd.sh); Telegram and the
# chat-helper apps stay on notifications in this build.
on:
  push:
    tags: ['v*', '!v*-beta.*'] # beta tags come from `publish`; see "Pushing a regular release tag" above
  schedule:
    - cron: '17 3 * * *' # fresh beta, only with NOOK_FRESH_BETA=true (see above)
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which version to release'
        type: choice
        default: beta
        options:
          - beta
          - patch
          - minor
          - major
          - stable

permissions:
  contents: read

# One release at a time, so two runs never pick the same tag.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Seconds on ubuntu: which tag, from which commit, and whether to release at all. The macOS runner starts only after.
  plan:
    if: github.event_name != 'schedule' || vars.NOOK_FRESH_BETA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags and the history between them
          persist-credentials: false
      - name: Plan the release
        id: plan
        env:
          BUMP: ${{ github.event.inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMMIT="$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push)
              TAG="$GITHUB_REF_NAME"
              # Publishing with NOOK_RELEASE_TOKEN creates the tag, and unlike the workflow's own token that starts
              # this workflow again; the tag already has its release then, so there is nothing to build.
              if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
                echo "$TAG is already published; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
                echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
              fi ;;
            schedule)
              # The newest release (drafts included, so a release that is still being finished counts too).
              LAST="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0] | "\(.tag_name) \(.created_at)"' || true)"
              LAST_TAG="${LAST%% *}"
              if [ -n "$LAST" ]; then
                AGE=$(( $(date +%s) - $(date -d "${LAST#* }" +%s) ))
                if [ "$AGE" -lt $((20 * 3600)) ]; then
                  echo "No fresh beta: $LAST_TAG is only $((AGE / 3600)) hours old." | tee -a "$GITHUB_STEP_SUMMARY"
                  echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
                fi
                if git rev-parse -q --verify "refs/tags/$LAST_TAG" >/dev/null && \
                  [ -z "$(git rev-list "refs/tags/$LAST_TAG..$COMMIT" -- . ':!*.md' ':!docs')" ]; then
                  echo "No fresh beta: main has nothing new for users since $LAST_TAG." | tee -a "$GITHUB_STEP_SUMMARY"
                  echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
                fi
              fi
              TAG="$(scripts/next-release-tag.sh beta)" ;;
            workflow_dispatch)
              TAG="$(scripts/next-release-tag.sh "$BUMP")"
              if [ "$BUMP" = stable ]; then
                # Built from the newest beta of this version, which is what beta users have been running. The run
                # itself starts on that tag, so every job checks out exactly that commit (no checkout of a computed ref).
                SOURCE="$(git tag -l "$TAG-beta.*" | sort -V | tail -n 1)"
                if [ "$GITHUB_REF" != "refs/tags/$SOURCE" ]; then
                  echo "::error::Run a stable release on the tag of its newest beta: Run workflow › Use workflow from › Tags › $SOURCE (this run is on $GITHUB_REF)."; exit 1
                fi
                if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
                  echo "::error::$SOURCE is not on main; a stable release is made from a beta that landed on main."; exit 1
                fi
                echo "Promoting $SOURCE ($COMMIT) to $TAG." | tee -a "$GITHUB_STEP_SUMMARY"
              fi ;;
            *) echo "::error::Unexpected event $GITHUB_EVENT_NAME."; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' is not a version tag like v0.1.0-beta.1 or v1.0.0."
            exit 1
          fi
          { echo "release=true"; echo "tag=$TAG"; echo "commit=$COMMIT"; } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write # creates the draft release
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      marketing: ${{ steps.version.outputs.marketing }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      DERIVED_DATA: ${{ github.workspace }}/.derived-data
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
    defaults:
      run:
        working-directory: apps/macos
    steps:
      # The commit the run started on: main, the pushed tag, or the beta tag of a stable release (see `plan`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the version
        id: version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          MARKETING="${VERSION%%-*}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The marketing version takes only digits and dots; the beta suffix stays in the tag and the release title.
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-beta.*) echo "title=Nook $MARKETING Beta ${VERSION##*-beta.}" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *-*) echo "title=Nook $VERSION" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "title=Nook $VERSION" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Releasing $TAG"
      - name: Select newest Xcode (the MLX packages need Xcode 26)
        id: xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          echo "build=$(xcodebuild -version | tail -1 | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      # The Swift packages (MLX, FluidAudio, llama.cpp, …) take about 20 minutes cold. Their Release build products are
      # cached per Xcode build and project.yml, apart from the Debug cache of build.yml; Nook's own sources always rebuild.
      - name: Restore Swift package build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            .derived-data
            !.derived-data/Logs
            !.derived-data/Build/Intermediates.noindex/Nook.build
          key: macos-release-dd-${{ steps.xcode.outputs.build }}-${{ hashFiles('apps/macos/project.yml') }}
          restore-keys: macos-release-dd-${{ steps.xcode.outputs.build }}-
      - name: Install XcodeGen
        uses: ./.github/actions/setup-xcodegen
      - name: Generate project
        run: xcodegen
      - name: Resolve Swift packages
        run: |
          # GitHub and the package hosts occasionally drop a clone; retry before failing the build on it.
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project Nook.xcodeproj -scheme Nook -derivedDataPath "$DERIVED_DATA" && exit 0
            echo "::warning::Package resolution failed (attempt $attempt); retrying."
            sleep $((attempt * 20))
          done
          exit 1
      # Unsigned build; the app is signed ad hoc below, after the source stamp is removed.
      - name: Build (Release)
        timeout-minutes: 90
        # Release builds Swift in whole-module mode by default: Nook's one large module then compiles in a single process
        # and took over 30 minutes. Single-file mode compiles its files in parallel, still optimized (-O).
        run: |
          set -o pipefail
          xcodebuild build -project Nook.xcodeproj -scheme Nook -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO SWIFT_COMPILATION_MODE=singlefile \
            MARKETING_VERSION="${STEPS_VERSION_OUTPUTS_MARKETING}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            NOOK_RELAY_URL="${VARS_NOOK_RELAY_URL}" NOOK_UPDATE_PUBLIC_KEY="${VARS_NOOK_UPDATE_PUBLIC_KEY}" \
            2>&1 | tee build.log
        env:
          STEPS_VERSION_OUTPUTS_MARKETING: ${{ steps.version.outputs.marketing }}
          VARS_NOOK_RELAY_URL: ${{ vars.NOOK_RELAY_URL }}
          VARS_NOOK_UPDATE_PUBLIC_KEY: ${{ vars.NOOK_UPDATE_PUBLIC_KEY }}
      - name: Save Swift package build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Errors and warnings
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true
      # Developer ID (MACOS_DEVELOPER_ID_P12) is preferred; otherwise a stable self-signed identity (MACOS_SIGNING_P12);
      # otherwise ad hoc. Each P12 is base64 in its secret, with its password in the matching *_PASSWORD secret.
      - name: Import the signing identity
        env:
          DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -n "$DEVELOPER_ID_P12" ]; then KIND=developer-id; P12="$DEVELOPER_ID_P12"; PASS="$DEVELOPER_ID_PASSWORD"
          elif [ -n "$SIGNING_P12" ]; then KIND=self-signed; P12="$SIGNING_P12"; PASS="$SIGNING_PASSWORD"
          else
            # An ad-hoc build loses its Keychain access and privacy permissions with every update, so it is not released.
            echo "::error::No signing identity in the secrets (MACOS_DEVELOPER_ID_P12 or MACOS_SIGNING_P12). Make one with scripts/make-release-identity.sh."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$PASS" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is not trusted, so ask for every code-signing identity, valid or not.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | sed -n 's/^ *[0-9]*) \([0-9A-F]\{40\}\) .*/\1/p' | head -n 1)"
          test -n "$IDENTITY"
          { echo "SIGN_KIND=$KIND"; echo "SIGN_IDENTITY=$IDENTITY"; echo "SIGN_KEYCHAIN=$KEYCHAIN"; } >> "$GITHUB_ENV"
          echo "Signing with a $KIND identity."
      - name: Prepare the app
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/Nook.app"
          test -d "$APP"
          PLIST="$APP/Contents/Info.plist"
          # The update button in the Agents footer rebuilds Nook from the git checkout it was built from. A downloaded
          # build has none (this one points at the runner), so remove the stamp and Nook offers no source updates.
          for KEY in NookSourceCommit NookSourceBranch NookSourceRoot NookDeveloperDir; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" 2>/dev/null || true
          done
          # Instead it updates from this repository's releases: the full version (with -beta.N) and where to look.
          for KEY in NookReleaseVersion NookReleaseRepository; do
            /usr/libexec/PlistBuddy -c "Delete :$KEY" "$PLIST" 2>/dev/null || true
          done
          /usr/libexec/PlistBuddy -c "Add :NookReleaseVersion string ${STEPS_VERSION_OUTPUTS_VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NookReleaseRepository string $GITHUB_REPOSITORY" "$PLIST"
          # The key the app checks its next update with; a build without it can never install one by itself.
          KEY="$(/usr/libexec/PlistBuddy -c "Print :NookUpdatePublicKey" "$PLIST" 2>/dev/null || true)"
          if [ -z "$KEY" ] || [ "$KEY" != "${VARS_NOOK_UPDATE_PUBLIC_KEY}" ]; then
            echo "::error::Info.plist does not carry NOOK_UPDATE_PUBLIC_KEY."
            exit 1
          fi
          # Sign: nested code first, then the app with its entitlements. See "Signing" at the top.
          if [ -n "$SIGN_IDENTITY" ]; then
            SIGN=(--force --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN")
            # Notarization needs the hardened runtime and a secure timestamp. A self-signed certificate has no team, so
            # the runtime's library validation would refuse Nook's own frameworks: that build goes without it.
            if [ "$SIGN_KIND" = "developer-id" ]; then SIGN+=(--options runtime --timestamp); else SIGN+=(--timestamp=none); fi
          else
            # Ad-hoc signature: Apple Silicon runs only signed code.
            SIGN=(--force --sign - --timestamp=none)
          fi
          find "$APP/Contents" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.xpc' -o -name '*.appex' \) -print |
            while IFS= read -r ITEM; do codesign "${SIGN[@]}" "$ITEM"; done
          codesign "${SIGN[@]}" --entitlements App/Nook.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p "$RUNNER_TEMP/dist"
          ditto "$APP" "$RUNNER_TEMP/dist/Nook.app"
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          VARS_NOOK_UPDATE_PUBLIC_KEY: ${{ vars.NOOK_UPDATE_PUBLIC_KEY }}
      - name: Package .dmg and .zip
        working-directory: ${{ runner.temp }}/dist
        env:
          CONFIG: ${{ github.workspace }}/apps/macos/Config/DMG
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          ditto -c -k --keepParent Nook.app "Nook-$VERSION-macOS.zip"
          # The installer window: Nook's own layout as background (scripts/generate_dmg_background.py), the app on the
          # left, Applications on the right. dmgbuild writes the window's layout without driving Finder.
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --require-hashes -r "$CONFIG/requirements.txt"
          tiffutil -cathidpicheck "$CONFIG/background.png" "$CONFIG/background@2x.png" -out background.tiff
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s "$CONFIG/settings.py" -D app="$PWD/Nook.app" -D background="$PWD/background.tiff" \
            "Nook $VERSION" "Nook-$VERSION-macOS.dmg"
          rm background.tiff
          if [ "$SIGN_KIND" != "adhoc" ]; then codesign --force --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN" "Nook-$VERSION-macOS.dmg"; fi
      # With a Developer ID and the notary secrets, Apple checks the build, and the ticket is stapled to the .dmg and the
      # app: macOS then opens Nook without the "cannot verify the developer" block.
      - name: Notarize
        if: env.SIGN_KIND == 'developer-id'
        working-directory: ${{ runner.temp }}/dist
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          # An App Store Connect API key (the .p8 file's text in APPLE_NOTARY_KEY, with its key ID and issuer ID) is
          # preferred: unlike an app-specific password it does not depend on an Apple ID session or expire with a
          # password change. The Apple ID secrets remain as the fallback.
          if [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER" ]; then
            printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            AUTH=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          elif [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            AUTH=(--apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID")
          else
            echo "::warning::Developer ID signed but not notarized: set APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER (or APPLE_NOTARY_APPLE_ID, APPLE_NOTARY_PASSWORD and APPLE_TEAM_ID)."
            exit 0
          fi
          xcrun notarytool submit "Nook-$VERSION-macOS.dmg" "${AUTH[@]}" --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "Nook-$VERSION-macOS.dmg"
          xcrun stapler staple Nook.app
          # The .zip was made before the ticket existed: make it again with the stapled app.
          rm "Nook-$VERSION-macOS.zip"
          ditto -c -k --keepParent Nook.app "Nook-$VERSION-macOS.zip"
          spctl --assess --type open --context context:primary-signature --verbose=2 "Nook-$VERSION-macOS.dmg"
          echo "NOTARIZED=true" >> "$GITHUB_ENV"
      # The .zip is what a downloaded Nook installs as its update; it checks this signature against the public key it
      # carries. Signed after notarization, which makes the .zip again.
      - name: Sign the update
        working-directory: ${{ runner.temp }}/dist
        env:
          NOOK_UPDATE_SIGNING_KEY: ${{ secrets.NOOK_UPDATE_SIGNING_KEY }}
          NOOK_UPDATE_PUBLIC_KEY: ${{ vars.NOOK_UPDATE_PUBLIC_KEY }}
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          if [ -z "$NOOK_UPDATE_SIGNING_KEY" ] || [ -z "$NOOK_UPDATE_PUBLIC_KEY" ]; then
            # Without them, every build out there would have to download the next release by hand.
            echo "::error::NOOK_UPDATE_SIGNING_KEY or NOOK_UPDATE_PUBLIC_KEY is not set: make the pair with swift scripts/sign-update.swift generate (docs/UPDATES.md)."
            exit 1
          fi
          # Refuses a private key that does not belong to the public key the app carries.
          swift "$GITHUB_WORKSPACE/scripts/sign-update.swift" sign "Nook-$VERSION-macOS.zip" > "Nook-$VERSION-macOS.zip.sig"
          test -s "Nook-$VERSION-macOS.zip.sig"
      # codesign --verify says the signature is sound, not that the app starts: a framework the hardened runtime
      # refuses, a missing resource or a crash in launch code all pass it. Start the app exactly as users get it, from
      # the final .dmg, with an empty home folder, and fail the release when it does not stay up.
      - name: Launch check
        working-directory: ${{ runner.temp }}/dist
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "Nook-$VERSION-macOS.dmg" >/dev/null
          HOME_DIR="$RUNNER_TEMP/launch-home"
          mkdir -p "$HOME_DIR"
          HOME="$HOME_DIR" "$MOUNT/Nook.app/Contents/MacOS/Nook" > "$RUNNER_TEMP/launch.log" 2>&1 &
          PID=$!
          ALIVE=true
          for _ in $(seq 1 30); do
            sleep 1
            kill -0 "$PID" 2>/dev/null || { ALIVE=false; break; }
          done
          if [ "$ALIVE" = true ]; then
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            STATUS=0; wait "$PID" || STATUS=$?
          fi
          hdiutil detach "$MOUNT" -force >/dev/null || true
          if [ "$ALIVE" != true ]; then
            echo "::error::Nook.app from the .dmg exited within 30 seconds (status $STATUS)."
            tail -n 100 "$RUNNER_TEMP/launch.log" || true
            # The crash report says which library or symbol was missing.
            find "$HOME/Library/Logs/DiagnosticReports" "$HOME_DIR/Library/Logs/DiagnosticReports" -name 'Nook*' -newer "Nook-$VERSION-macOS.dmg" \
              -exec head -n 60 {} \; 2>/dev/null || true
            exit 1
          fi
          echo "Nook.app from the .dmg started and stayed up for 30 seconds."
      - name: Checksums
        working-directory: ${{ runner.temp }}/dist
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          shasum -a 256 "Nook-$VERSION-macOS.dmg" "Nook-$VERSION-macOS.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
      # Signed statement, kept by GitHub, that these files were built by this workflow from this commit. Its Sigstore
      # bundle is attached to the release too (.intoto.jsonl), so it can be checked offline:
      # `gh attestation verify <file> --bundle Nook-<version>-macOS.intoto.jsonl --repo IAMichan/Nook`.
      - name: Build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/Nook-*-macOS.dmg
            ${{ runner.temp }}/dist/Nook-*-macOS.zip
      - name: Provenance file
        working-directory: ${{ runner.temp }}/dist
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
        run: jq -c . "$BUNDLE" > "Nook-${STEPS_VERSION_OUTPUTS_VERSION}-macOS.intoto.jsonl"
      - name: Create the draft release
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ secrets.NOOK_RELEASE_TOKEN || github.token }} # see "Release token" at the top
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          STEPS_VERSION_OUTPUTS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          STEPS_VERSION_OUTPUTS_TITLE: ${{ steps.version.outputs.title }}
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          # GitHub's own list of what changed since the last release; it goes folded away at the bottom of the page.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$RELEASE_COMMIT" \
            --jq .body > changes.md || : > changes.md
          # The page: banner, download button and the downloads on top, then the install steps (scripts/release-notes.sh).
          TAG="$TAG" VERSION="$VERSION" REPO="$GITHUB_REPOSITORY" PRERELEASE="${STEPS_VERSION_OUTPUTS_PRERELEASE}" \
            NOTARIZED="${NOTARIZED:-false}" DMG="Nook-$VERSION-macOS.dmg" ZIP="Nook-$VERSION-macOS.zip" CHANGES=changes.md \
            "$GITHUB_WORKSPACE/scripts/release-notes.sh" > notes.md
          FLAGS=""
          [ "${STEPS_VERSION_OUTPUTS_PRERELEASE}" = "true" ] && FLAGS="--prerelease"
          test -s "Nook-$VERSION-macOS.zip.sig"
          test -s "Nook-$VERSION-macOS.intoto.jsonl"
          FILES=("Nook-$VERSION-macOS.dmg" "Nook-$VERSION-macOS.zip" "Nook-$VERSION-macOS.zip.sig" SHA256SUMS.txt
            "Nook-$VERSION-macOS.intoto.jsonl")
          # shellcheck disable=SC2086 # FLAGS is empty or one flag
          # A draft: not visible to users or the in-app updater, and the tag is created only when `publish` makes it
          # public. A draft left behind by an earlier failed run of this tag is replaced.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "${STEPS_VERSION_OUTPUTS_TITLE}" \
            --notes-file notes.md --draft $FLAGS "${FILES[@]}"
      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-log-${{ github.run_attempt }}
          path: apps/macos/build.log
          retention-days: 7
          if-no-files-found: ignore

  # Windows and Linux, from the same commit. Runs next to the macOS build; its artifacts land in this run.
  tauri:
    name: Windows and Linux
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/tauri.yml
    with:
      version: ${{ needs.release.outputs.marketing }}

  desktop:
    name: Attach Windows and Linux
    needs: [release, tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads to the release and edits its page
      id-token: write # build provenance attestation
      attestations: write
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nook-*
          path: ${{ runner.temp }}/desktop
      - name: Attach to the release
        working-directory: ${{ runner.temp }}/desktop
        env:
          GH_TOKEN: ${{ secrets.NOOK_RELEASE_TOKEN || github.token }} # see "Release token" at the top
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir out
          # One clear name per download, like the macOS files: Nook-<version>-<platform>.<ext>.
          pick() { # glob, name
            local found
            found="$(find . -path ./out -prune -o -type f -name "$1" -print | head -1)"
            [ -n "$found" ] || { echo "::error::No $1 in the Windows/Linux artifacts."; exit 1; }
            cp "$found" "out/$2"
          }
          pick '*-setup.exe' "Nook-$VERSION-Windows-setup.exe"
          pick '*.msi' "Nook-$VERSION-Windows.msi"
          pick '*.deb' "Nook-$VERSION-Linux.deb"
          pick '*.AppImage' "Nook-$VERSION-Linux.AppImage"
          cd out
          sha256sum -- * > SHA256SUMS-Windows-Linux.txt
          cat SHA256SUMS-Windows-Linux.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
          # The page was written for the Mac; add the other downloads under it.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "## Windows and Linux"
            echo
            echo "Not code-signed yet: Windows SmartScreen asks for **More info › Run anyway** on the first launch."
            echo
            echo "- Windows: [installer (.exe)]($base/Nook-$VERSION-Windows-setup.exe) · [.msi]($base/Nook-$VERSION-Windows.msi)"
            echo "- Linux: [.deb]($base/Nook-$VERSION-Linux.deb) · [.AppImage]($base/Nook-$VERSION-Linux.AppImage)"
            echo "- [SHA-256 checksums]($base/SHA256SUMS-Windows-Linux.txt)"
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
      - name: Build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/desktop/out/Nook-*
      # The Sigstore bundle of that statement, next to the files it covers (see "Build provenance" of the macOS job).
      - name: Attach the provenance
        env:
          GH_TOKEN: ${{ secrets.NOOK_RELEASE_TOKEN || github.token }} # see "Release token" at the top
          TAG: ${{ needs.release.outputs.tag }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/Nook-${TAG#v}-Windows-Linux.intoto.jsonl"
          jq -c . "$BUNDLE" > "$FILE"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- "$FILE"

  # Only now, with every file attached, does the release become public: the tag is created, the release page appears,
  # and the in-app updater of a downloaded Nook sees it.
  publish:
    name: Publish
    needs: [release, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the draft and creates the tag
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.NOOK_RELEASE_TOKEN || github.token }} # see "Release token" at the top
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Everything a user or the updater downloads must be there before anyone can see the release.
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for NAME in "Nook-$VERSION-macOS.dmg" "Nook-$VERSION-macOS.zip" "Nook-$VERSION-macOS.zip.sig" SHA256SUMS.txt \
            "Nook-$VERSION-macOS.intoto.jsonl" "Nook-$VERSION-Windows-Linux.intoto.jsonl" "Nook-$VERSION-Windows-setup.exe" "Nook-$VERSION-Windows.msi" "Nook-$VERSION-Linux.deb" \
            "Nook-$VERSION-Linux.AppImage" SHA256SUMS-Windows-Linux.txt; do
            grep -qxF "$NAME" <<<"$ASSETS" || { echo "::error::$NAME is missing from the draft of $TAG."; exit 1; }
          done
          # Only a regular release becomes "Latest"; a beta stays a pre-release.
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
