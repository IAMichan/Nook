name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev) rates the repository's supply-chain practices: branch protection, pinned
# actions, token permissions, dependency updates, code review, signed releases and more. The results go to the
# Security tab (code scanning) and to the public scorecard.dev API behind the README badge, so a contributor or user
# can see how Nook is run before they trust it. Runs on ubuntu once a week, when the branch rules change, and on pushes
# to main that change the workflows; it reads the repository and runs none of its code.
on:
  schedule:
    - cron: '41 5 * * 1'
  branch_protection_rule:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/dependabot.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to scorecard.dev (signed with the workflow's OIDC identity)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
