# Every label this repository uses. workflows/labels.yml creates or updates them on GitHub when this file changes on
# main; labels that are not listed here are left alone. Area labels are added to pull requests by workflows/labeler.yml
# (paths in labeler.yml), and release.yml sorts the release notes by these labels.

# Kind
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or improvement
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: security
  color: "b60205"
  description: Security hardening or a fix for a vulnerability
- name: testing
  color: "fbca04"
  description: A report from testing Nook on a platform or device
- name: question
  color: "d876e3"
  description: Further information is requested

# Contributors
- name: good first issue
  color: "7057ff"
  description: Small and self-contained, good for a first contribution
- name: help wanted
  color: "008672"
  description: Open for contributors

# Triage
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: wontfix
  color: "ffffff"
  description: This will not be worked on
- name: dependencies
  color: "0366d6"
  description: Pull requests that update a dependency file
- name: skip changelog
  color: "ededed"
  description: Leave this pull request out of the release notes
- name: via agent
  color: "c5def5"
  description: Issue filed by a coding agent through the agent report form
- name: needs triage
  color: "fbca04"
  description: New issue a maintainer has not looked at yet; remove the label once it has an area and a kind
- name: preview
  color: "1d76db"
  description: Build an unsigned macOS app of this pull request to try (workflows/macos-preview.yml)
- name: needs more info
  color: "d876e3"
  description: Waiting for the reporter; closed by workflows/stale.yml after 7 days without a reply
- name: stale
  color: "ededed"
  description: No activity for a while; closed by workflows/stale.yml unless something happens
- name: keep open
  color: "0e8a16"
  description: Never marked stale or closed by workflows/stale.yml or workflows/pr-limits.yml
- name: needs rebase
  color: "e99695"
  description: Conflicts with main; closed by workflows/pr-limits.yml after 7 days without activity
- name: agent-context-increase
  color: "fef2c0"
  description: A maintainer accepts that AGENTS.md or CLAUDE.md grows (workflows/agent-context-budget.yml)

# Pull request size (set by workflows/pr-size.yml: changed lines, tests excluded)
- name: "size:XS"
  color: "0e8a16"
  description: Fewer than 10 changed lines
- name: "size:S"
  color: "5ebd3e"
  description: 10 to 29 changed lines
- name: "size:M"
  color: "fbca04"
  description: 30 to 99 changed lines
- name: "size:L"
  color: "e99695"
  description: 100 to 499 changed lines
- name: "size:XL"
  color: "d93f0b"
  description: 500 to 999 changed lines
- name: "size:XXL"
  color: "b60205"
  description: 1000 or more changed lines

# Pull request author trust (set by workflows/pr-vouch.yml from .github/VOUCHED.td)
- name: "vouch:trusted"
  color: "1f883d"
  description: Author has write access, is a bot, or is in VOUCHED.td
- name: "vouch:unvouched"
  color: "fbca04"
  description: Author is not yet in VOUCHED.td
- name: "vouch:denounced"
  color: "d1242f"
  description: Author is blocked in VOUCHED.td

# Area: which part of the monorepo
- name: "area: macos"
  color: "1d76db"
  description: The macOS app (apps/macos)
- name: "area: ios"
  color: "1d76db"
  description: Nook Companion for iPhone (apps/ios)
- name: "area: tauri"
  color: "1d76db"
  description: The Tauri app for Windows, Linux, and Android (apps/tauri)
- name: "area: windows"
  color: "c5def5"
  description: Windows-specific behavior of the Tauri app
- name: "area: linux"
  color: "c5def5"
  description: Linux-specific behavior of the Tauri app
- name: "area: android"
  color: "c5def5"
  description: Android-specific behavior of the Tauri app
- name: "area: chatd"
  color: "1d76db"
  description: The chat bridge helper (apps/chatd)
- name: "area: protocol"
  color: "1d76db"
  description: Shared packages (packages/protocol, packages/core)
- name: "area: i18n"
  color: "bfdadc"
  description: Translations and localization
- name: "area: ci"
  color: "bfdadc"
  description: GitHub Actions, scripts, and repository tooling
- name: "area: docs"
  color: "bfdadc"
  description: README, CONTRIBUTING, and docs/
