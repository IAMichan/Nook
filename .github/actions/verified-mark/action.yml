name: Mark verified
description: >-
  Records that a job passed on the inputs verified-check fingerprinted, so a later run on the same inputs can skip it.
  Use it as the last step of the job, after everything that has to pass.
inputs:
  name:
    description: The same name that was given to verified-check.
    required: true
  fingerprint:
    description: The fingerprint output of verified-check.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/verified.txt"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verified-${{ inputs.name }}-${{ inputs.fingerprint }}
        path: ${{ runner.temp }}/verified.txt
        retention-days: 30
        overwrite: true
