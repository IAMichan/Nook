# Area labels for pull requests, by the paths they change (used by workflows/labeler.yml with actions/labeler).
# The platform labels (windows, linux, android) only follow platform-specific folders; shared Tauri code gets "area: tauri".
"area: macos":
  - changed-files:
      - any-glob-to-any-file: "apps/macos/**"
"area: ios":
  - changed-files:
      - any-glob-to-any-file: "apps/ios/**"
"area: tauri":
  - changed-files:
      - any-glob-to-any-file: "apps/tauri/**"
"area: windows":
  - changed-files:
      - any-glob-to-any-file: "apps/tauri/src-tauri/src/platform/windows/**"
"area: linux":
  - changed-files:
      - any-glob-to-any-file: "apps/tauri/src-tauri/src/platform/linux/**"
"area: android":
  - changed-files:
      - any-glob-to-any-file: ["apps/tauri/src-tauri/gen/android/**", "apps/tauri/src-tauri/src/platform/android.rs", "apps/android/**"]
"area: chatd":
  - changed-files:
      - any-glob-to-any-file: "apps/chatd/**"
"area: protocol":
  - changed-files:
      - any-glob-to-any-file: "packages/**"
"area: i18n":
  - changed-files:
      - any-glob-to-any-file: "apps/macos/Core/I18n*.swift"
"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "scripts/**"]
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]
