name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - Android
        - iPhone (Nook Companion)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version and device
      placeholder: macOS 15.5, MacBook Pro M3 / Windows 11, ThinkPad X1 / Ubuntu 24.04 (X11) / Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nook version or commit
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Please omit any API keys or personal data.
      render: text
