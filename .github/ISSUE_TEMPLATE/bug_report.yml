name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.5, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nook version or commit
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Please omit any API keys or personal data.
      render: text
