name: Bug melden
description: Iets werkt niet zoals verwacht
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Wat gebeurt er?
      description: Wat deed je, wat verwachtte je en wat gebeurde er?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Stappen om het na te doen
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: macos
    attributes:
      label: macOS-versie en Mac
      placeholder: macOS 15.5, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nook-versie of commit
  - type: textarea
    id: logs
    attributes:
      label: Foutmeldingen of logs
      description: Laat API-sleutels en persoonlijke gegevens weg.
      render: text
