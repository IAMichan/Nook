[package]
name = "nook"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nook: je persoonlijke agent, voor Windows, Linux en Android"

[lib]
name = "nook_lib"
# Geen staticlib: die is alleen voor iOS nodig en kost per build ruim een gigabyte.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nook-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
chrono.workspace = true
uuid.workspace = true
async-trait.workspace = true
# Companion: QR-code om te koppelen, aankondiging en opzoeken op het lokale netwerk (mDNS/Bonjour).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
mdns-sd = "0.21"
gethostname = "1"
if-addrs = "0.15"
regex.workspace = true
tauri-plugin-notification = "2"
base64 = "0.22"
percent-encoding = "2"
dirs.workspace = true
reqwest.workspace = true
fancy-regex = "0.14"
url = "2"
iana-time-zone = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
cpal = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-collections = "0.3"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media",
  "Media_Control",
  "Media_Core",
  "Media_Ocr",
  "Media_Playback",
  "Media_SpeechRecognition",
  "Media_SpeechSynthesis",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
zbus = "5"
x11rb = { version = "0.13", features = ["screensaver", "xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[lints]
workspace = true
