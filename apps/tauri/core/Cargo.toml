[package]
name = "nook-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platformonafhankelijke kern van Nook: brein, opslag, geheugen, agents en koppelingen."

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
async-trait.workspace = true
regex.workspace = true
rusqlite.workspace = true
dirs.workspace = true
log.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
