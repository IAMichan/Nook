# Advisories that osv-scanner (and OpenSSF Scorecard, which runs it) reports for Cargo.lock and package-lock.json but
# that have no fixed release to move to. Each one says why it does not reach Nook and expires, so it is looked at again;
# drop an entry as soon as an update removes the crate. Anything with a fix is updated instead of listed here.

# glib 0.18: unsound VariantStrIter. Linux only, pulled in by gtk 0.18 through tauri, wry, tray-icon and muda; Nook never
# iterates a GVariant string array. The fix is glib 0.20, which needs gtk-rs 0.20 in Tauri.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2027-05-13T00:00:00Z
reason = "Linux-only via gtk 0.18 (Tauri); VariantStrIter is not used; needs Tauri on gtk-rs 0.20"

# proc-macro-error: unmaintained, no vulnerability. A build-time macro of glib-macros 0.18 (same chain as above).
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2027-05-13T00:00:00Z
reason = "Unmaintained notice only; build-time proc macro of glib-macros 0.18 (Tauri on Linux)"

# ttf-parser: unmaintained, no vulnerability. Used by lopdf through pdf-extract, which has no release without it.
