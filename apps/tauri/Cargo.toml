[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
log = "0.4"

[workspace.lints.clippy]
# De adapters spiegelen de initializers op de Mac; een struct per aanroep maakt ze niet duidelijker.
too_many_arguments = "allow"

# Installers are built once per release and run on every start: thin LTO lets the optimizer work across crates at a
# modest build-time cost, and stripping leaves the symbol tables out of the shipped binary, which makes it a lot smaller.
[profile.release]
lto = "thin"
strip = true
