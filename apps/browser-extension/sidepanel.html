<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nook</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <img class="face" src="icons/nook-32.png" alt="" width="22" height="22">
    <h1 data-i18n="appName">Nook</h1>
    <span id="status" class="pill" role="status"></span>
  </header>

  <section id="setup" class="card setup" hidden>
    <h2 data-i18n="setupTitle"></h2>
    <ol>
      <li data-i18n="setupStep1"></li>
      <li data-i18n="setupStep2"></li>
      <li data-i18n="setupStep3"></li>
    </ol>
    <p class="note" id="setup-detail"></p>
  </section>

  <section class="card site">
    <div class="row">
      <div class="grow">
        <div id="site-name" class="site-name"></div>
        <div id="site-note" class="note"></div>
      </div>
      <label class="switch" id="site-switch-wrap">
        <input type="checkbox" id="site-switch" role="switch">
        <span aria-hidden="true"></span>
      </label>
    </div>
    <div class="row pause-row">
      <div id="paused-note" class="note grow"></div>
      <button id="pause" type="button" class="quiet"></button>
    </div>
  </section>

  <main id="chat" class="chat" aria-live="polite">
    <p id="intro" class="intro" data-i18n="intro"></p>
  </main>

  <section class="activity" aria-labelledby="activity-title">
    <details id="activity-box">
      <summary id="activity-title"><span data-i18n="activityTitle"></span></summary>
      <ul id="activity"></ul>
    </details>
  </section>

  <form id="composer" class="composer">
    <div class="composer-box">
      <textarea id="input" rows="2" data-i18n-placeholder="askPlaceholder"></textarea>
      <div class="composer-row">
        <button id="new-chat" type="button" class="quiet small" data-i18n="newChat"></button>
        <span class="grow"></span>
        <button id="stop" type="button" class="round stop" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7" rx="1.5"/></svg>
        </button>
        <button id="send" type="submit" class="round send">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M3.75 7.5 8 3.25l4.25 4.25"/></svg>
        </button>
      </div>
    </div>
  </form>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
