<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nook</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <img class="face" src="icons/nook-32.png" alt="" width="20" height="20">
    <h1 data-i18n="appName">Nook</h1>
    <span id="status" class="pill" role="status"></span>
    <span class="grow"></span>
    <!-- Select an element (or a spot in a PDF) on the page and copy where it is, for a coding agent's prompt. -->
    <!-- On a PDF it shows a page with a marked spot instead, as it then copies a spot in the PDF. -->
    <button id="pick" type="button" class="icon">
      <svg class="when-page" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/><circle cx="12" cy="12" r=".6"/></svg>
      <svg class="when-pdf" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="14" r=".6"/></svg>
    </button>
    <button id="find-open" type="button" class="icon" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>
    </button>
    <button id="outline-open" type="button" class="icon" popovertarget="outline" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
    </button>
    <button id="history-open" type="button" class="icon" popovertarget="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4v4h4"/><path d="M12 7.5V12l3 2"/></svg>
    </button>
    <button id="new-chat" type="button" class="icon" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L12 14.8l-3.6.8.8-3.6Z"/></svg>
    </button>
    <button id="pause" type="button" class="icon">
      <svg class="when-active" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
      <svg class="when-paused" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5Z"/></svg>
    </button>
  </header>

  <!-- Find in this conversation: every match marked (CSS highlights), the current one brought into view. -->
  <div id="find-bar" class="find" role="search" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>
    <input id="find-field" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="findPlaceholder">
    <span id="find-count" class="find-count" aria-live="polite"></span>
    <button id="find-prev" type="button" class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
    </button>
    <button id="find-next" type="button" class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button id="find-close" type="button" class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <!-- The questions in this conversation, to jump to one. -->
  <div id="outline" class="menu" popover>
    <div class="menu-title" data-i18n="questionsTitle"></div>
    <ul id="outline-list" class="menu-list"></ul>
  </div>

  <!-- The conversations started in this panel, to go back to one. -->
  <div id="history" class="menu" popover>
    <div class="menu-title" data-i18n="chatsTitle"></div>
    <ul id="history-list" class="menu-list"></ul>
  </div>

  <div id="paused-banner" class="banner" role="status" hidden>
    <span id="paused-note" class="grow"></span>
    <button id="resume" type="button" class="warn small" data-i18n="resume"></button>
  </div>

  <!-- What the crosshair did: what to click now, what it copied, or why it could not. -->
  <div id="pick-note" class="banner pick-note" role="status" hidden></div>

  <section id="setup" class="card setup" hidden>
    <h2 data-i18n="setupTitle"></h2>
    <ol>
      <li data-i18n="setupStep1"></li>
      <li data-i18n="setupStep2"></li>
      <li data-i18n="setupStep3"></li>
    </ol>
    <p class="note" id="setup-detail"></p>
  </section>

  <section class="site">
    <span id="site-mark" class="site-mark" aria-hidden="true"></span>
    <div class="grow">
      <div id="site-name" class="site-name"></div>
      <div id="site-note" class="site-note"></div>
    </div>
    <label class="switch" id="site-switch-wrap">
      <input type="checkbox" id="site-switch" role="switch">
      <span aria-hidden="true"></span>
    </label>
  </section>

  <div class="chat-wrap">
  <main id="chat" class="chat" aria-live="polite" tabindex="-1">
    <div id="empty" class="empty">
      <img class="empty-face" src="icons/nook-128.png" alt="" width="44" height="44">
      <p class="intro" data-i18n="intro"></p>
      <div class="suggestions">
        <button type="button" class="suggestion" data-suggest="suggestSummary"></button>
        <button type="button" class="suggestion" data-suggest="suggestImportant"></button>
        <button type="button" class="suggestion" data-suggest="suggestNext"></button>
      </div>
    </div>
    <!-- Earlier messages than the newest ones Nook sends, read back page by page. -->
    <button id="earlier" type="button" class="earlier" hidden></button>
    <!-- Nook's shared transcript (packages/web-ui), mounted by sidepanel.js from ui/composer.js. -->
    <div id="transcript"></div>
  </main>
  <!-- Moving through the conversation: back to the newest answer once you scrolled up, and question by question. -->
  <button id="to-latest" type="button" class="to-latest" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    <span id="to-latest-label"></span>
  </button>
  <div id="question-nav" class="question-nav" hidden>
    <button id="question-prev" type="button" class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
    </button>
    <button id="question-next" type="button" class="icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
  </div>

  <section class="activity" aria-labelledby="activity-title">
    <details id="activity-box">
      <summary id="activity-title"><span data-i18n="activityTitle"></span></summary>
      <ul id="activity"></ul>
    </details>
  </section>

  <!-- Nook's shared composer (packages/web-ui), mounted by sidepanel.js from ui/composer.js. -->
  <div id="composer" class="composer"></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
