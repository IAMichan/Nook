name: NookCompanion
options:
  bundleIdPrefix: nl.imdigital
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Matches the Xcode the project is built with, so Xcode does not ask to "Update to recommended settings".
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # iPhone companion (docs/COMPANION.md): sessions that need you, with approve / answer / send / stop. It shares the
  # protocol and the sealing with the Mac app (packages/protocol) and nothing else.
  NookCompanion:
    type: application
    platform: iOS
    sources:
      - path: NookCompanion
      - path: Shared
      - path: ../../packages/protocol/Sources
    dependencies:
      - target: NookActivity
    info:
      path: NookCompanion/Info.plist
      properties:
        CFBundleName: Nook Companion
        CFBundleDisplayName: Nook Companion
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Nook Companion talks to Nook on your Mac over your own wifi to show which sessions need you.
        NSCameraUsageDescription: Nook Companion scans the pairing code that Nook shows on your Mac.
        UIBackgroundModes: [remote-notification]
        # nook://pair (the QR code scanned with the Camera app) and nook://prompt (a link that prefills a new session).
        CFBundleURLTypes:
          - CFBundleURLName: nl.imdigital.nook.companion
            CFBundleURLSchemes: [nook]
        # One Live Activity per session that works on the Mac (NookActivity, docs/COMPANION.md › Live Activities).
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_NAME: Nook Companion
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.companion
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: NookCompanion/NookCompanion.entitlements
      properties:
        # Becomes production in a distribution build. Needs Push Notifications on the app id nl.imdigital.nook.companion.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
  # The Live Activity (Lock Screen and Dynamic Island) for sessions working on the Mac. The Mac starts, updates and ends
  # it with liveactivity pushes (topic nl.imdigital.nook.companion.push-type.liveactivity); the app does too while open.
  NookActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: NookActivity
      - path: Shared
      - path: NookCompanion/Theme.swift
      - path: NookCompanion/Localizable.xcstrings
      # The only shared protocol file it needs: the activity's attributes and content.
      - path: ../../packages/protocol/Sources/CompanionLiveActivity.swift
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: NookActivity/Info.plist
      properties:
        CFBundleName: Nook Activity
        CFBundleDisplayName: Nook Companion
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: NookActivity
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.companion.activity
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  NookCompanion:
    build:
      targets:
        NookCompanion: all
    run:
      config: Debug
