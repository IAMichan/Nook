name: NookCompanion
options:
  bundleIdPrefix: nl.imdigital
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Matches the Xcode the project is built with, so Xcode does not ask to "Update to recommended settings".
  xcodeVersion: "27.2"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # iPhone companion (docs/COMPANION.md): sessions that need you, with approve / answer / send / stop. It shares the
  # protocol and the sealing with the Mac app (packages/protocol) and nothing else.
  NookCompanion:
    type: application
    platform: iOS
    sources:
      - path: NookCompanion
      - path: Shared
      # The phone's Foundation-only logic, tested on the Mac (NookTests): dictation's languages, diagrams and math.
      - path: Core
      - path: ../../packages/protocol/Sources
      # Mermaid and KaTeX, the same files the Mac ships, so diagrams and math draw offline (`RichMessageText`).
      - path: ../macos/Resources/mermaid
        type: folder
        buildPhase: resources
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: ../macos/Resources/katex
        type: folder
        buildPhase: resources
        group: Shared from the Mac
        createIntermediateGroups: false
      # The agents' and models' real marks, drawn in code, shared with the Mac app so both show the same logos.
      # Everything from the Mac stays in one group without intermediate groups: XcodeGen would also list these files
      # under an "apps" group, and Xcode refuses to open a project with a member in two groups.
      - path: ../macos/NotchUI/Components/BrandLogo.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      # The one theme: colors, the type scale (Dynamic Type on the phone), radii, spacing and motion.
      - path: ../macos/NotchUI/Theme/NookTheme.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      # The Mac's Markdown parser (Foundation only), so an agent's answer reads as blocks on both (`MarkdownBlocksView`).
      - path: ../macos/Brain/MarkdownBlock.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      # Replying to an answer and the quote a message of yours starts with (`AnswerReply`), as on the Mac.
      - path: ../macos/Services/Workspace/ComposerQuotes.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: ../macos/Brain/ChatChart.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: ../macos/Brain/ChartRescue.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: ../macos/NotchUI/Theme/NookPalette.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      # The icons: Lucide as custom symbols, and the table that names them (`Image(icon:)`).
      - path: ../macos/NotchUI/Theme/NookIcon.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: ../macos/Resources/Lucide.xcassets
        group: Shared from the Mac
        createIntermediateGroups: false
      # The components both apps share: buttons, badges, list parts, agent logos and rows, chat rows and bubbles, your
      # messages and the time under them.
      - path: ../macos/NotchUI/Shared
        group: Shared from the Mac
        createIntermediateGroups: false
    dependencies:
      - target: NookActivity
      - target: NookNotifications
      - target: NookShare
    info:
      path: NookCompanion/Info.plist
      properties:
        CFBundleName: Nook Companion
        CFBundleDisplayName: Nook Companion
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The canvas behind Nook's own launch screen (`LaunchView`): black, so opening the app has no white flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Nook Companion talks to Nook on your Mac over your own wifi to show which sessions need you.
        NSCameraUsageDescription: Nook Companion scans the pairing code that Nook shows on your Mac.
        # Dictation in the composers (`Dictation`): recognized on the iPhone itself where it can be; never sent to the Mac.
        NSMicrophoneUsageDescription: Nook Companion listens while you dictate a message, and only then.
        NSSpeechRecognitionUsageDescription: Nook Companion turns what you dictate into text, on this iPhone where it can.
        # Saving a diagram from a message (`RichSegmentView`): add-only, Nook Companion never reads your photos.
        NSPhotoLibraryAddUsageDescription: Nook Companion saves the diagram you touch and hold to your photos.
        # Finds the Mac again on the network when Nook restarted on another port (CompanionClient, MacFinder).
        NSBonjourServices: [_nookcompanion._tcp]
        UIBackgroundModes: [remote-notification]
        # nook://pair (the QR code scanned with the Camera app) and nook://prompt (a link that prefills a new session).
        CFBundleURLTypes:
          - CFBundleURLName: nl.imdigital.nook.companion
            CFBundleURLSchemes: [nook]
        # One Live Activity per session that works on the Mac (NookActivity, docs/COMPANION.md › Live Activities).
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_NAME: Nook Companion
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.companion
        # The same icon as the Mac app, drawn by scripts/generate_app_icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: NookCompanion/NookCompanion.entitlements
      properties:
        # Temporarily off so a Personal Team can sign the app. Push Notifications (aps-environment: development, production
        # in a distribution build) and Time Sensitive Notifications (com.apple.developer.usernotifications.time-sensitive)
        # need a paid team and both capabilities on the app id nl.imdigital.nook.companion; put them back with one.
        # Shared with NookNotifications: the push keys it opens relay pushes with (PushKeyStore). Needs the App Group
        # group.nl.imdigital.nook.companion on both app ids.
        com.apple.security.application-groups: [group.nl.imdigital.nook.companion]
  # The Live Activity (Lock Screen and Dynamic Island) for sessions working on the Mac. The Mac starts, updates and ends
  # it with liveactivity pushes (topic nl.imdigital.nook.companion.push-type.liveactivity); the app does too while open.
  NookActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: NookActivity
      - path: Shared
      - path: ../macos/NotchUI/Theme/NookTheme.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: ../macos/NotchUI/Theme/NookPalette.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: NookCompanion/Theme.swift
      - path: NookCompanion/Localizable.xcstrings
      # The only shared protocol files it needs: the activity's attributes and content, the usage widget's timeline and
      # the agent activity widget's snapshot.
      - path: ../../packages/protocol/Sources/CompanionLiveActivity.swift
      - path: ../../packages/protocol/Sources/CompanionUsageWidget.swift
      - path: ../../packages/protocol/Sources/CompanionAgentWidget.swift
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: NookActivity/Info.plist
      properties:
        CFBundleName: Nook Activity
        CFBundleDisplayName: Nook Companion
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: NookActivity
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.companion.activity
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    # The usage widget reads the limits the app keeps in the app group (`UsageSnapshot`). Needs the App Group
    # group.nl.imdigital.nook.companion on the app id nl.imdigital.nook.companion.activity too.
    entitlements:
      path: NookActivity/NookActivity.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.imdigital.nook.companion]
  # Opens notifications that came through Nook's relay (docs/COMPANION.md › Push through Nook's relay): the text is
  # sealed with the pairing's push key, which the app keeps in the shared Keychain (PushKeyStore); falls back to
  # "Nook needs you".
  NookNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NookNotifications
      - path: NookCompanion/PushKeyStore.swift
      - path: NookCompanion/Localizable.xcstrings
      - path: ../../packages/protocol/Sources
    dependencies:
      - sdk: UserNotifications.framework
    info:
      path: NookNotifications/Info.plist
      properties:
        CFBundleName: Nook Notifications
        CFBundleDisplayName: Nook Companion
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_NAME: NookNotifications
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.companion.notifications
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: NookNotifications/NookNotifications.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.imdigital.nook.companion]
  # The share sheet's "Nook" (docs/COMPANION.md › Sharing to Nook): text, links, pictures and a file into a new session, a
  # session or a question to Nook. It holds no pairing key: it leaves the share in the app group (`ShareQueue`), and the
  # app sends it through its outbox. Needs the App Group on the app id nl.imdigital.nook.companion.share.
  NookShare:
    type: app-extension
    platform: iOS
    sources:
      - path: NookShare
      - path: Shared/AppGroup.swift
      - path: ../../packages/protocol/Sources
      - path: ../macos/NotchUI/Theme/NookTheme.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: ../macos/NotchUI/Theme/NookPalette.swift
        group: Shared from the Mac
        createIntermediateGroups: false
      - path: NookCompanion/Theme.swift
      - path: NookCompanion/ImagePicking.swift
      - path: NookCompanion/Localizable.xcstrings
    dependencies:
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: NookShare/Info.plist
      properties:
        CFBundleName: Nook Share
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 2
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: NookShare
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.companion.share
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: NookShare/NookShare.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.imdigital.nook.companion]
schemes:
  NookCompanion:
    build:
      targets:
        NookCompanion: all
    run:
      config: Debug
