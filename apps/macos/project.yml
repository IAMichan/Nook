name: Nook
options:
  bundleIdPrefix: nl.imdigital
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Matches the Xcode the project is built with, so Xcode does not ask to "Update to recommended settings".
  xcodeVersion: "26.0"
  # Signs local builds with your Apple Development certificate when there is one (see Config/Signing.xcconfig).
  preGenCommand: sh Config/local-signing.sh
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    # 3.31.x: newer versions require a Swift toolchain (6.3) not yet available in Xcode 26.3.
    exactVersion: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    minorVersion: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  FluidAudio:
    # Parakeet speech-to-text and speaker diarization on the Neural Engine (Apache-2.0).
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
  LlamaSwift:
    # llama.cpp as a ready-built xcframework (MIT): runs the GGUF model that autocomplete uses (one on this Mac or one you pick).
    url: https://github.com/mattt/llama.swift
    exactVersion: 2.10549.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # The built-in terminal (Workspace › Terminals). Pinned: a stable release whose API matches TerminalSessions.swift.
    exactVersion: 1.16.0
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: NotchUI
      - path: Demo
      - path: Core
      - path: Services
      - path: Brain
      # Shared with the iOS companion (apps/ios): protocol, sealing, hashing.
      - path: ../../packages/protocol/Sources
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftTerm
        product: SwiftTerm
      - package: LlamaSwift
        product: LlamaSwift
      - package: FluidAudio
        product: FluidAudio
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Nook
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: app.nook.link
            CFBundleURLSchemes: [nook]
        LSMinimumSystemVersion: "15.0"
        NSCalendarsFullAccessUsageDescription: Nook reads your calendar to suggest and schedule appointments.
        NSContactsUsageDescription: Nook looks up a contact's email address or phone number when you ask it to.
        NSRemindersFullAccessUsageDescription: Nook creates reminders for you.
        NSMicrophoneUsageDescription: Nook only listens when you request it, to convert your voice into actions.
        NSSpeechRecognitionUsageDescription: Nook transcribes speech to text, preferably on-device.
        NSAudioCaptureUsageDescription: Nook listens to the sound of Spotify or Music (never records it) to move the equalizer with the music.
        NSAppleEventsUsageDescription: Nook controls Spotify, Apple Music, and select system settings for you.
    entitlements:
      path: App/Nook.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.network.client: true
    # CODE_SIGN_IDENTITY and DEVELOPMENT_TEAM come from here, so a local signing identity survives every `xcodegen`.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook
        # Hardened runtime: other programs cannot inject code into Nook and inherit its screen, microphone and automation access.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # Core chat tests (source scoping, retrieval and citations, action validation and execution).
  # This code relies solely on Foundation, so files are included directly in the test bundle: no app host required for testing.
  # Also tests core workspace logic (models, stream parsers, Git, storage, process handling).
  NookTests:
    type: bundle.unit-test
