    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Nook:
    build:
      targets:
        Nook: all
      # Without an Apple Development certificate: re-signs the ad-hoc build with the stable local identity, so macOS keeps
      # the permissions you granted (see Config/local-signing.sh). Does nothing when Xcode already signs with a team.
      postActions:
        - name: Sign with local identity
          settingsTarget: Nook
          script: sh "$SRCROOT/Config/resign-local.sh"
    test:
      targets:
        - NookTests
    run:
      config: Debug
  # Only the unit tests. NookTests compiles the core sources itself and has no app host, so `scripts/xcode.sh test` uses
  # this scheme and does not build Nook.app and its packages (MLX, Transformers, FluidAudio, llama) first. CI keeps
  # testing with the Nook scheme, which also checks that the app builds.
  NookTests:
    build:
      targets:
        NookTests: all
    test:
      targets:
        - NookTests
