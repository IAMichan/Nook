name: Nook
# The end-to-end scenarios' targets and scheme (docs/SCENARIOS.md).
include:
  - Scenarios/scenarios.yml
options:
  bundleIdPrefix: nl.imdigital
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Matches the Xcode the project is built with, so Xcode does not ask to "Update to recommended settings".
  xcodeVersion: "27.2"
  # Gives local builds a stable signing identity, so macOS keeps granted permissions (see Config/Signing.xcconfig).
  preGenCommand: sh Config/local-signing.sh
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    # 3.31.x: newer versions require a Swift toolchain (6.3) not yet available in Xcode 26.3.
    exactVersion: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    minorVersion: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  FluidAudio:
    # Parakeet speech-to-text and speaker diarization on the Neural Engine (Apache-2.0).
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
  LlamaSwift:
    # llama.cpp as a ready-built xcframework (MIT): runs the GGUF model that autocomplete uses (one on this Mac or one you pick).
    url: https://github.com/mattt/llama.swift
    exactVersion: 2.10549.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # The built-in terminal (Workspace › Terminals). Pinned: a stable release whose API matches TerminalSessions.swift.
    exactVersion: 1.16.0
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: NotchUI
      - path: Demo
      - path: Core
      - path: Services
      - path: Brain
      # Shared with the iOS companion (apps/ios): protocol, sealing, hashing.
      - path: ../../packages/protocol/Sources
      # The companion relay's code (apps/relay), which Settings deploys to the user's own Cloudflare account
      # (CloudflareRelayDeployer); in the app as Resources/worker. No intermediate groups: XcodeGen would put the "apps"
      # group in the project twice, next to the one for packages, and Xcode refuses to open a project like that.
      - path: ../relay/worker
        createIntermediateGroups: false
        type: folder
        buildPhase: resources
      # Nook's browser extension (apps/browser-extension), which Settings › Editor & browser copies to Application Support
      # for the browser's "Load unpacked" (BrowserExtensionService). A folder, like the relay above.
      - path: ../browser-extension
        createIntermediateGroups: false
        type: folder
        buildPhase: resources
      # Mermaid's script, so a diagram draws without asking a server (see THIRD-PARTY-NOTICES.md).
      - path: Resources/mermaid
        type: folder
        buildPhase: resources
      # KaTeX's script, style and fonts, so math typesets without asking a server (see THIRD-PARTY-NOTICES.md).
      - path: Resources/katex
        type: folder
        buildPhase: resources
      # Lucide's icons as custom symbols (NookIcon, scripts/lucide-icons.sh; see THIRD-PARTY-NOTICES.md).
      - path: Resources/Lucide.xcassets
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftTerm
        product: SwiftTerm
      - package: LlamaSwift
        product: LlamaSwift
      - package: FluidAudio
        product: FluidAudio
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Nook
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        # Where this build came from, for the update button in the Agents footer (Services/Updates). The commit and
        # branch are stamped in by Config/stamp-source.sh after this file is processed.
        NookSourceRoot: "$(SRCROOT)"
        NookBuildConfiguration: "$(CONFIGURATION)"
        NookDeveloperDir: "$(DEVELOPER_DIR)"
        # A downloaded build updates from GitHub Releases instead (Services/Updates/ReleaseUpdateCore.swift): release.yml
        # stamps NookReleaseVersion and NookReleaseRepository, and the build setting NOOK_UPDATE_PUBLIC_KEY (the repository
        # variable of the same name) is the Ed25519 key its updates must be signed with. Empty: no automatic installs.
        NookUpdatePublicKey: "$(NOOK_UPDATE_PUBLIC_KEY)"
        # Nook's own app registrations, so linking Telegram and Teams needs nothing but your login. Set the build
        # settings NOOK_TELEGRAM_API_ID / NOOK_TELEGRAM_API_HASH (my.telegram.org) and NOOK_TEAMS_CLIENT_ID (Microsoft
        # Entra); while they are empty, Settings › Chats asks for your own.
        NookTelegramAPIID: "$(NOOK_TELEGRAM_API_ID)"
        NookTelegramAPIHash: "$(NOOK_TELEGRAM_API_HASH)"
        NookTeamsClientID: "$(NOOK_TEAMS_CLIENT_ID)"
        # Nook's own relay for the iPhone companion away from home (apps/relay, deployed by relay-deploy.yml): set the
        # build setting NOOK_RELAY_URL; while it is empty, Settings offers only a relay on the user's own account.
        NookRelayURL: "$(NOOK_RELAY_URL)"
        # nook:// is Nook's own and stays first. http/https and web pages only make Nook one of the browsers macOS offers:
        # it becomes the default only when you choose it (Settings › Browser, IncomingLinkRoute).
        CFBundleURLTypes:
          - CFBundleURLName: app.nook.link
            CFBundleURLSchemes: [nook]
          - CFBundleURLName: app.nook.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web page
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, public.xhtml]
        LSMinimumSystemVersion: "15.0"
        NSCalendarsFullAccessUsageDescription: Nook reads your calendar to suggest and schedule appointments.
        NSContactsUsageDescription: Nook looks up a contact's email address or phone number when you ask it to.
        NSRemindersFullAccessUsageDescription: Nook creates reminders for you.
        NSMicrophoneUsageDescription: Nook only listens when you request it, to convert your voice into actions.
        NSSpeechRecognitionUsageDescription: Nook transcribes speech to text, preferably on-device.
        NSAudioCaptureUsageDescription: Nook listens to the sound of Spotify or Music (never records it) to move the equalizer with the music.
        NSAppleEventsUsageDescription: Nook controls Spotify, Apple Music, Messages (to send what you write in Chats), Xcode (to build an update), and select system settings for you.
    entitlements:
      path: App/Nook.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.network.client: true
    # CODE_SIGN_IDENTITY and DEVELOPMENT_TEAM come from here, so a local signing identity survives every `xcodegen`.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook
        # Hardened runtime: other programs cannot inject code into Nook and inherit its screen, microphone and automation access.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # The build phases below read the git checkout and the TDLib that scripts/build-tdlib.sh built, which a
        # sandboxed script may not.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp source commit
        # Writes the commit this build was made from into the built Info.plist (see Config/stamp-source.sh).
        script: sh "$SRCROOT/Config/stamp-source.sh"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
      - name: Embed TDLib
        # Copies the TDLib that scripts/build-tdlib.sh built into the app and signs it like Nook, for the Telegram bridge
        # (see Config/embed-tdlib.sh). Without it, nothing happens.
        script: sh "$SRCROOT/Config/embed-tdlib.sh"
        basedOnDependencyAnalysis: false
      - name: Embed chat helper
        # Copies nook-chatd, which scripts/build-chatd.sh built, into Contents/Helpers and signs it like Nook, for Signal,
        # Messenger, Instagram, X and LinkedIn (see Config/embed-chatd.sh). Without it, nothing happens.
        script: sh "$SRCROOT/Config/embed-chatd.sh"
        basedOnDependencyAnalysis: false
  # Core chat tests (source scoping, retrieval and citations, action validation and execution).
  # This code relies solely on Foundation, so files are included directly in the test bundle: no app host required for testing.
  # Also tests core workspace logic (models, stream parsers, Git, storage, process handling).
  NookTests:
