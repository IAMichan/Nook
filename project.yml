name: Nook
options:
  bundleIdPrefix: nl.imdigital
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: nl
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    # 3.31.x: newer versions require a Swift toolchain (6.3) not yet available in Xcode 26.3.
    exactVersion: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    minorVersion: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # The built-in terminal (Workspace › Terminals). Pinned: a stable release whose API matches TerminalSessions.swift.
    exactVersion: 1.16.0
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: NotchUI
      - path: Demo
      - path: Core
      - path: Services
      - path: Brain
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Nook
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSCalendarsFullAccessUsageDescription: Nook reads your calendar to suggest and schedule appointments.
        NSContactsUsageDescription: Nook looks up a contact's email address or phone number when you ask it to.
        NSRemindersFullAccessUsageDescription: Nook creates reminders for you.
        NSMicrophoneUsageDescription: Nook only listens when you request it, to convert your voice into actions.
        NSSpeechRecognitionUsageDescription: Nook transcribes speech to text, preferably on-device.
        NSAudioCaptureUsageDescription: Nook listens to the sound of Spotify or Music (never records it) to move the equalizer with the music.
        NSAppleEventsUsageDescription: Nook controls Spotify, Apple Music, and select system settings for you.
    entitlements:
      path: App/Nook.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook
        # Hardened runtime: other programs cannot inject code into Nook and inherit its screen, microphone and automation access.
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: 35SMNHP9K7
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # Core chat tests (source scoping, retrieval and citations, action validation and execution).
  # This code relies solely on Foundation, so files are included directly in the test bundle: no app host required for testing.
  # Also tests core workspace logic (models, stream parsers, Git, storage, process handling).
  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NookTests
      - path: Brain/SourceScope.swift
      - path: Brain/LocalQuality.swift
      - path: Brain/MailStats.swift
      - path: Brain/Retrieval.swift
      - path: Brain/ActionGate.swift
      - path: Brain/CommandRisk.swift
      - path: Brain/NetworkGuard.swift
      - path: Brain/ToolLoop.swift
      - path: Brain/ModelAdvisor.swift
      - path: Brain/ModelDownload.swift
      - path: Brain/ChatIntent.swift
      - path: Brain/Research.swift
      - path: Brain/QueryPlan.swift
      - path: Brain/NookDates.swift
      - path: Brain/AppData.swift
      - path: Brain/BrainSelection.swift
      - path: Brain/AIProvider.swift
      - path: App/ConversationList.swift
      - path: App/ChatRecovery.swift
      - path: Services/AgentSessionRegistry.swift
      - path: Services/FinishedSessions.swift
      - path: Core/NookError.swift
      - path: Core/NookPaths.swift
      - path: Core/SafeStorage.swift
      - path: Core/Accounts.swift
      - path: Services/Connectors/MCP/MCPClient.swift
      - path: Services/Connectors/MCP/MCPOAuth.swift
      - path: Services/Workspace/WorkspaceModels.swift
      - path: Services/Workspace/AgentAttention.swift
      - path: Services/Workspace/Delegation.swift
      - path: Services/Workspace/ContextHandoff.swift
      - path: Services/Workspace/ComposerCore.swift
      - path: Services/Workspace/AgentStatusStyle.swift
      - path: Services/Workspace/TimelineCopy.swift
      - path: Services/Workspace/InboxLayout.swift
      - path: Services/Workspace/UndoLog.swift
      - path: Services/Workspace/AutoSettlePolicy.swift
      - path: Services/Workspace/MessageQueue.swift
      - path: Services/Workspace/TurnSafety.swift
      - path: Services/Workspace/FailureClassifier.swift
      - path: Services/Workspace/ChangedFilesTree.swift
      - path: Services/Workspace/TimelineSearch.swift
      - path: Services/Workspace/ScrollModel.swift
      - path: Services/Workspace/HistoryWindow.swift
      - path: Services/Workspace/TimelineHandles.swift
      - path: Services/Workspace/SkillIndex.swift
      - path: Services/Workspace/ComposerDrafts.swift
      - path: Services/Workspace/AgentCommands.swift
      - path: Services/Workspace/EffortLevels.swift
      - path: Services/Workspace/AgentAdvice.swift
      - path: Services/Workspace/SourceControlHost.swift
      - path: Services/Workspace/PullRequestLinks.swift
      - path: Services/Workspace/ScheduledTasks.swift
      - path: Services/Workspace/WebhookSecurity.swift
      - path: Services/Workspace/SettingsResolver.swift
      - path: Services/Workspace/Keybindings.swift
      - path: Services/Workspace/PromptLink.swift
      - path: Services/Workspace/PriceTable.swift
      - path: Services/Workspace/WorkspaceBridgeProtocol.swift
      - path: Services/Workspace/TimelinePresentation.swift
      - path: Services/Workspace/DevServers.swift
      - path: Services/Workspace/ProjectScripts.swift
      - path: Services/Workspace/CodexAppServer.swift
      - path: Services/Workspace/AcpAgent.swift
      - path: Services/Workspace/AgentModelCatalog.swift
      - path: Services/Workspace/TextGeneration.swift
      - path: Services/Workspace/GitCheckpoints.swift
      - path: Services/Workspace/GitQuickActions.swift
      - path: Services/Workspace/UsageLimits.swift
      - path: Services/Workspace/Antigravity.swift
      - path: Services/Workspace/AgentStreamParsers.swift
      - path: Services/Workspace/GitService.swift
      - path: Services/Workspace/RunStore.swift
      - path: Services/Workspace/AgentProcess.swift
      - path: Services/AgentTranscript.swift
      - path: Services/AntigravityClient.swift
      - path: Brain/ChatChart.swift
      - path: Brain/MarkdownBlock.swift
      - path: Brain/ChartRescue.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Nook:
    build:
      targets:
        Nook: all
    test:
      targets:
        - NookTests
    run:
      config: Debug
