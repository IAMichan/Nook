name: Nook
options:
  bundleIdPrefix: nl.imdigital
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: nl
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    # 3.31.x: nieuwere versies vragen een Swift-toolchain (6.3) die nog niet in Xcode 26.3 zit.
    exactVersion: 3.31.4
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    minorVersion: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: NotchUI
      - path: Demo
      - path: Core
      - path: Services
      - path: Brain
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Nook
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSCalendarsFullAccessUsageDescription: Nook leest je agenda om afspraken voor te stellen en te maken.
        NSRemindersFullAccessUsageDescription: Nook maakt herinneringen voor je aan.
        NSMicrophoneUsageDescription: Nook luistert alleen mee als jij erom vraagt, om je stem om te zetten in acties.
        NSSpeechRecognitionUsageDescription: Nook zet wat je zegt om in tekst, bij voorkeur op je eigen Mac.
        NSAppleEventsUsageDescription: Nook bedient Spotify en Muziek en een paar systeeminstellingen voor je.
    entitlements:
      path: App/Nook.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: 35SMNHP9K7
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # Tests van de kern van de chat (bronkeuze, opzoeken en bronverwijzingen, controle en uitvoeren van acties).
  # Die code gebruikt alleen Foundation, dus de bestanden gaan rechtstreeks in de testbundel: geen app nodig om te testen.
  # Ook de kern van de werkruimte (modellen, stream-parsers, Git, opslag, procesafhandeling).
  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NookTests
      - path: Brain/SourceScope.swift
      - path: Brain/MailStats.swift
      - path: Brain/Retrieval.swift
      - path: Brain/ActionGate.swift
      - path: Services/Workspace/WorkspaceModels.swift
      - path: Services/Workspace/AgentStreamParsers.swift
      - path: Services/Workspace/GitService.swift
      - path: Services/Workspace/RunStore.swift
      - path: Services/Workspace/AgentProcess.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.imdigital.nook.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Nook:
    build:
      targets:
        Nook: all
    test:
      targets:
        - NookTests
    run:
      config: Debug
